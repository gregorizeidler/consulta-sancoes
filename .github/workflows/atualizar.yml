name: atualizar
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: paginas
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache dos arquivos brutos (fallback se uma fonte cair)
        uses: actions/cache@v4
        with:
          path: data/bruto
          key: bruto-${{ github.run_id }}
          restore-keys: bruto-
      - name: Baixar e normalizar as listas
        env:
          PORTAL_TRANSPARENCIA_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_KEY }}
        run: python3 src/coleta.py
      - name: Gerar o site
        run: python3 src/gera_site.py
      - name: Sintaxe dos scripts do site
        run: for f in site/*.js; do node --check "$f"; done
      - name: Testes do motor de busca
        run: node tests/test_motor.js
      - name: Benchmark de precisao e recall (falha abaixo dos minimos)
        run: node tests/benchmark.js --check
      - name: Indice invertido contra a varredura completa
        run: node tests/indice_oracle.js --check
      - name: Fuzzing do motor
        run: node tests/fuzz_motor.js 3000
      - name: Vigilancia (nomes do vigilancia.json)
        run: node src/vigilancia.js
      - name: Testes da base normalizada
        run: python3 tests/test_dados.py
      - name: Testes das fontes (esquema, queda, CPF mascarado)
        run: python3 tests/test_fontes.py
      - name: Testes do manifesto
        run: node tests/test_manifesto.js
      - name: Guardar snapshot de ids para o diff do dia seguinte
        run: |
          git config user.name "sancoes-bot"
          git config user.email "sancoes-bot@users.noreply.github.com"
          git add data/ids.json data/resumo.json data/historico.json data/manifesto.json data/vigilancia-alertas.json
          git diff --quiet && git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
